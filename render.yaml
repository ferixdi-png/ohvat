services:
  - type: web
    name: ferixdi-ai-voice-mentor
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: OPENAI_API_KEY
        sync: false
      - key: MENTOR_ACCESS_CODE
        sync: false
      - key: ALLOWED_ORIGIN
        sync: false
      - key: OPENAI_REALTIME_MODEL
        value: gpt-realtime-1.5
