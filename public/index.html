<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080a0b">
  <meta name="description" content="Голосовой наставник Ferixdi AI — без воды, про AI-Reels, охваты и рост аудитории.">
  <title>Ferixdi AI — голосовой наставник</title>
  <style>
    :root{color-scheme:dark;--bg:#080a0b;--red:#c41f48;--acid:#dfff00;--blue:#6ca9d4}
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;min-height:100%;background:var(--bg)}
    body{min-height:100svh;display:grid;place-items:center;overflow:hidden;isolation:isolate}
    body:before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(circle at 50% 50%,#c41f481c,transparent 27%),radial-gradient(circle at 50% 50%,#6ca9d40a,transparent 48%),#080a0b}
    .grid{position:fixed;inset:-50%;z-index:0;pointer-events:none;opacity:.12;background-image:linear-gradient(#fff 1px,transparent 1px),linear-gradient(90deg,#fff 1px,transparent 1px);background-size:56px 56px;mask-image:radial-gradient(ellipse at center,#000 0%,transparent 62%);transform:perspective(700px) rotateX(58deg) translateY(17%)}
    .orb-button{position:relative;z-index:2;display:grid;place-items:center;width:min(76vw,300px);aspect-ratio:1;border:0;padding:0;border-radius:50%;background:transparent;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;outline:none;isolation:isolate}
    .orb-button:focus-visible{outline:2px solid var(--acid);outline-offset:12px}
    .orb-button:disabled{cursor:wait}
    .aura{position:absolute;inset:14%;border-radius:50%;background:#c41f483d;filter:blur(30px);animation:aura 4s ease-in-out infinite;pointer-events:none}
    .pulse{position:absolute;inset:4%;border:1px solid #c41f4855;border-radius:50%;animation:pulse 3.2s ease-out infinite;pointer-events:none}
    .pulse.p2{animation-delay:1.6s}
    .orbit{position:absolute;inset:1%;border:1px solid #ffffff20;border-radius:50%;pointer-events:none;animation:spin 24s linear infinite}
    .orbit:before,.orbit:after{content:"";position:absolute;width:7px;height:7px;top:17%;left:16%;border-radius:50%;background:var(--blue);box-shadow:0 0 16px var(--blue)}
    .orbit:after{top:auto;left:auto;right:12%;bottom:19%;width:5px;height:5px;background:var(--acid);box-shadow:0 0 14px var(--acid)}
    .orb{position:relative;width:58%;aspect-ratio:1;border-radius:50%;overflow:hidden;background:radial-gradient(circle at 32% 22%,#ff9bb4 0,#e52e59 12%,#a8173a 35%,#501023 61%,#080a0b 80%);border:1px solid #ffffff4a;box-shadow:inset -18px -22px 36px #020305d9,inset 9px 8px 24px #ffffff4a,0 0 26px #c41f4855,0 0 90px #c41f482b;transition:transform .35s ease,filter .35s ease,box-shadow .35s ease;pointer-events:none;animation:float 5s ease-in-out infinite}
    .orb:before{content:"";position:absolute;inset:-35%;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 30%,#ffffffbd 39%,transparent 46% 70%,#dfff0080 78%,transparent 84%);filter:blur(8px);animation:spin 8s linear infinite}
    .orb:after{content:"";position:absolute;inset:9px;border-radius:50%;border:1px solid #ffffff38;box-shadow:inset 0 0 24px #ffffff10}
    .core{position:absolute;inset:29%;border-radius:50%;background:radial-gradient(circle at 35% 28%,#ffc4d2b3,transparent 45%),radial-gradient(circle,#c41f48a8,transparent 72%);filter:blur(9px)}
    .bars{position:absolute;display:flex;align-items:center;gap:4px;height:28px;pointer-events:none}
    .bars i{display:block;width:3px;height:8px;border-radius:8px;background:#fff;box-shadow:0 0 10px #fff;animation:wave 1s ease-in-out infinite}
    .bars i:nth-child(2),.bars i:nth-child(8){height:15px;animation-delay:-.7s}.bars i:nth-child(3),.bars i:nth-child(7){height:21px;animation-delay:-.4s}.bars i:nth-child(4),.bars i:nth-child(6){height:13px;animation-delay:-.2s}.bars i:nth-child(5){height:27px;animation-delay:-.5s}
    body.connected .orb{background:radial-gradient(circle at 32% 22%,#f4ff9c 0,#dfff00 13%,#839e00 35%,#35420b 61%,#080a0b 80%);box-shadow:inset -18px -22px 36px #020305d9,inset 9px 8px 24px #ffffff4a,0 0 34px #dfff0080,0 0 100px #dfff0040}
    body.connected .aura{background:#dfff0033}
    body.connected .orbit{border-color:#dfff0044}
    body.connected .orb-button:active .orb{transform:scale(.96)}
    body.speaking .orb{transform:scale(1.07);filter:brightness(1.15)}
    body.speaking .pulse{animation-duration:1.2s}
    body.speaking .bars i{animation-duration:.4s}
    body.listening .orb{transform:scale(1.025)}
    .error{position:fixed;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
    audio{display:none}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes pulse{0%{transform:scale(.72);opacity:0}20%{opacity:.6}100%{transform:scale(1.15);opacity:0}}
    @keyframes float{0%,100%{translate:0 0}50%{translate:0 -6px}}
    @keyframes aura{0%,100%{transform:scale(.88);opacity:.65}50%{transform:scale(1.12);opacity:1}}
    @keyframes wave{0%,100%{transform:scaleY(.45);opacity:.65}50%{transform:scaleY(1.1);opacity:1}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}.grid{display:none}}
  </style>
</head>
<body>
  <div class="grid" aria-hidden="true"></div>
  <button class="orb-button" id="talk" type="button" aria-label="Начать или завершить голосовой разговор">
    <span class="aura"></span><span class="pulse"></span><span class="pulse p2"></span><span class="orbit"></span>
    <span class="orb"><span class="core"></span></span>
    <span class="bars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
  </button>
  <div class="error" id="error" role="status" aria-live="polite"></div>
  <audio id="remoteAudio" autoplay playsinline></audio>
  <script type="module">
    const button=document.querySelector("#talk"),statusText=document.querySelector("#statusText"),errorEl=document.querySelector("#error"),audioEl=document.querySelector("#remoteAudio");
    let pc=null,stream=null,channel=null,connecting=false,connected=false;
    const handledToolCalls=new Set();
    let accessCode=sessionStorage.getItem("ferixdi_mentor_access_code")||"";
    function status(text){statusText.textContent=text}
    function error(text){errorEl.textContent=text;errorEl.hidden=!text}
    function sendEvent(event){if(channel?.readyState==="open")channel.send(JSON.stringify(event))}
    async function stop(){
      sendEvent({type:"session.close"});
      if(channel){try{channel.close()}catch{}}
      if(pc){try{pc.close()}catch{}}
      if(stream)stream.getTracks().forEach(track=>track.stop());
      pc=null;channel=null;stream=null;audioEl.srcObject=null;
      document.body.classList.remove("connected","speaking","listening");
      connected=false;connecting=false;button.disabled=false;status("Сеанс завершён");
    }
    async function start(){
      if(connecting)return;
      connecting=true;button.disabled=true;error("");status("Устанавливаю защищённое соединение…");
      try{
        if(!window.isSecureContext&&location.hostname!=="localhost")throw new Error("Для микрофона нужен HTTPS.");
        if(!accessCode&&!sessionStorage.getItem("ferixdi_access_prompted")){
          const code=prompt("Введи код доступа, если он у тебя есть. Если код не выдавали — оставь пустым.");
          sessionStorage.setItem("ferixdi_access_prompted","1");accessCode=code||"";
          if(accessCode)sessionStorage.setItem("ferixdi_mentor_access_code",accessCode);
        }
        stream=await navigator.mediaDevices.getUserMedia({audio:true});
        pc=new RTCPeerConnection();pc.addTrack(stream.getAudioTracks()[0],stream);
        pc.ontrack=event=>{audioEl.srcObject=event.streams[0];audioEl.play().catch(()=>{})};
        pc.onconnectionstatechange=()=>{
          if(pc?.connectionState==="connected"){connected=true;connecting=false;button.disabled=false;document.body.classList.add("connected");status("На связи. Твой ход.");error("")}
          if(pc&&["failed","disconnected"].includes(pc.connectionState)){error("Связь прервалась. Попробуй подключиться ещё раз.");stop()}
        };
        channel=pc.createDataChannel("oai-events");
        channel.addEventListener("message",async event=>{
          let data;try{data=JSON.parse(event.data)}catch{return}
          if(data.type==="input_audio_buffer.speech_started"){status("Слушаю тебя…");document.body.classList.add("listening");document.body.classList.remove("speaking")}
          if(data.type==="input_audio_buffer.speech_stopped"){document.body.classList.remove("listening")}
          if(data.type==="conversation.item.input_audio_transcription.completed"){
            const transcript=String(data.transcript||"").trim();
            if(!transcript||!channel||channel.readyState!=="open")return;
            sendEvent({type:"response.create",response:{output_modalities:["audio"]}});
          }
          if(data.type==="response.output_item.done"&&data.item?.type==="function_call"&&data.item?.name==="search_course_knowledge"){
            const callId=data.item.call_id;
            if(!callId||handledToolCalls.has(callId)||!channel||channel.readyState!=="open")return;
            handledToolCalls.add(callId);
            let output={results:[],note:"Поиск по базе временно недоступен. Не выдумывай точный ответ; направь ученика к материалам обучения или Ferixdi @ferixdiii."};
            try{
              let args={};try{args=JSON.parse(data.item.arguments||"{}")}catch{}
              const response=await fetch("/api/knowledge-search",{method:"POST",headers:{"Content-Type":"application/json",...(accessCode?{"x-mentor-access-code":accessCode}:{})},body:JSON.stringify({query:String(args.query||"").slice(0,1200)})});
              if(response.ok){const found=await response.json();output={results:(found.results||[]).slice(0,4).map(item=>({source:item.source,text:String(item.text||"").slice(0,1800),score:item.score}))}}
            }catch{}
            sendEvent({type:"conversation.item.create",item:{type:"function_call_output",call_id:callId,output:JSON.stringify(output).slice(0,9000)}});
            sendEvent({type:"response.create",response:{output_modalities:["audio"]}});
          }
          if(data.type==="response.audio.started"||data.type==="output_audio_buffer.started"){status("Говорю…");document.body.classList.remove("listening");document.body.classList.add("speaking")}
          if(data.type==="response.audio.done"||data.type==="output_audio_buffer.stopped"){document.body.classList.remove("speaking");status("На связи. Твой ход.")}
          if(data.type==="error")error(data.error?.message||"Ошибка голосовой сессии.");
        });
        const offer=await pc.createOffer();await pc.setLocalDescription(offer);
        const sdpResponse=await fetch("/api/session",{method:"POST",body:offer.sdp,headers:{"Content-Type":"application/sdp",...(accessCode?{"x-mentor-access-code":accessCode}:{})}});
        if(!sdpResponse.ok){
          const details=await sdpResponse.text();let message="Не удалось подключить голосовой сервис.";
          try{const parsed=JSON.parse(details);if(parsed?.error)message=parsed.error}catch{}
          if(sdpResponse.status===401){sessionStorage.removeItem("ferixdi_mentor_access_code");sessionStorage.removeItem("ferixdi_access_prompted");accessCode=""}
          throw new Error(message);
        }
        await pc.setRemoteDescription({type:"answer",sdp:await sdpResponse.text()});status("Почти на связи…");
      }catch(e){
        await stop();
        error(e?.name==="NotAllowedError"?"Браузер не дал доступ к микрофону. Разреши микрофон в адресной строке и нажми ещё раз.":(e?.message||"Не удалось подключиться."));
      }finally{connecting=false;button.disabled=false}
    }
    button.addEventListener("click",async()=>{if(connected){await stop();return}if(!connecting)await start()});
    window.addEventListener("beforeunload",()=>{stream?.getTracks().forEach(track=>track.stop());pc?.close()});
  </script>
</body>
</html>
