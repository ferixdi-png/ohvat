<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080a0b">
  <meta name="description" content="Голосовой наставник Ferixdi AI — без воды, про AI-Reels, охваты и рост аудитории.">
  <title>Ferixdi AI — голосовой наставник</title>
  <style>
    :root{color-scheme:dark;--bg:#07090b;--fg:#f7f8fa;--red:#c41f48;--acid:#dfff00;--blue:#6ca9d4;--muted:#9299a3;--ease:cubic-bezier(.16,1,.3,1)}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{min-height:100svh;display:grid;place-items:center;overflow:hidden;padding:24px;isolation:isolate}
    body:before{content:"";position:fixed;inset:0;z-index:-3;background:radial-gradient(ellipse at 50% 42%,#c41f4815,transparent 34%),radial-gradient(ellipse at 15% 85%,#6ca9d40b,transparent 35%),#07090b}
    .grid{position:fixed;inset:-50%;z-index:-2;opacity:.17;pointer-events:none;background-image:linear-gradient(#ffffff0a 1px,transparent 1px),linear-gradient(90deg,#ffffff0a 1px,transparent 1px);background-size:54px 54px;mask-image:radial-gradient(ellipse at center,#000 10%,transparent 68%);transform:perspective(700px) rotateX(58deg) translateY(17%);animation:grid-drift 24s linear infinite}
    main{width:min(100%,560px);display:flex;flex-direction:column;align-items:center;text-align:center;gap:23px;position:relative}
    .brandline{display:flex;align-items:center;gap:10px;color:#aeb4bc;font-size:11px;font-weight:700;letter-spacing:.28em;text-transform:uppercase}
    .brandmark{width:8px;height:8px;border-radius:50%;background:var(--acid);box-shadow:0 0 15px #dfff00a8;animation:blink 2.4s ease-in-out infinite}
    h1{margin:0;font-size:clamp(30px,7vw,48px);letter-spacing:-.065em;line-height:.99;font-weight:780}
    h1 span{color:transparent;background:linear-gradient(100deg,#fff 5%,#c6ccd4 40%,#dfff00 95%);background-clip:text;-webkit-background-clip:text}
    .sub{margin:0;max-width:370px;color:#a7adb6;font-size:14px;line-height:1.7}
    .orb-wrap{position:relative;display:grid;place-items:center;width:290px;height:290px;margin:0;isolation:isolate}
    .orbit{position:absolute;border-radius:50%;border:1px solid #ffffff14;inset:10px;animation:orbit-spin 22s linear infinite}
    .orbit:before,.orbit:after{content:"";position:absolute;width:6px;height:6px;border-radius:50%;background:var(--blue);box-shadow:0 0 18px #6ca9d4;top:18%;left:14%}
    .orbit:after{width:4px;height:4px;top:auto;left:auto;right:8%;bottom:24%;background:var(--acid);box-shadow:0 0 16px #dfff00}
    .orbit.two{inset:27px;border-style:dashed;border-color:#c41f4833;animation:orbit-spin 34s linear infinite reverse}
    .orbit.two:before{width:4px;height:4px;top:10%;left:64%;background:#f35c80;box-shadow:0 0 16px #f35c80}
    .aura{position:absolute;width:205px;height:205px;border-radius:50%;background:#c41f481c;filter:blur(34px);animation:aura 5s ease-in-out infinite}
    .orb{position:relative;width:160px;height:160px;border-radius:50%;overflow:hidden;border:1px solid #ffffff35;background:radial-gradient(circle at 33% 22%,#ff8ca8 0,#e52e59 12%,#a8173a 34%,#501023 59%,#090a0d 78%);box-shadow:inset -18px -22px 36px #020305c9,inset 9px 8px 24px #ffffff3b,0 0 24px #c41f4844,0 0 80px #c41f4823;transition:transform .7s var(--ease),box-shadow .7s var(--ease);animation:float 5s ease-in-out infinite}
    .orb:before{content:"";position:absolute;inset:-30%;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 26%,#ffffff00 32%,#ffffffa6 39%,#ffffff00 45% 68%,#dfff0066 76%,transparent 82%);filter:blur(8px);animation:orb-sheen 8s linear infinite}
    .orb:after{content:"";position:absolute;inset:10px;border-radius:50%;border:1px solid #ffffff38;box-shadow:inset 0 0 20px #ffffff0a}
    .core{position:absolute;z-index:1;inset:28px;border-radius:50%;background:radial-gradient(circle at 36% 30%,#ff9bb4a1,transparent 38%),radial-gradient(circle at 60% 70%,#c41f487a,transparent 60%);filter:blur(8px);opacity:.8}
    .soundbars{position:absolute;z-index:2;display:flex;align-items:center;gap:4px;height:32px;opacity:.78}
    .soundbars i{display:block;width:3px;height:8px;border-radius:5px;background:#fff;box-shadow:0 0 10px #ffffff90;animation:wave 1s ease-in-out infinite}
    .soundbars i:nth-child(2),.soundbars i:nth-child(8){animation-delay:-.7s;height:15px}
    .soundbars i:nth-child(3),.soundbars i:nth-child(7){animation-delay:-.4s;height:23px}
    .soundbars i:nth-child(4),.soundbars i:nth-child(6){animation-delay:-.2s;height:13px}
    .soundbars i:nth-child(5){height:28px;animation-delay:-.5s}
    .ring{position:absolute;inset:0;border:1px solid #c41f4830;border-radius:50%;animation:ring-pulse 3.6s ease-out infinite}
    .ring:nth-child(2){animation-delay:1.2s}.ring:nth-child(3){animation-delay:2.4s}
    .status{display:flex;align-items:center;justify-content:center;gap:9px;min-height:20px;color:#c7ccd2;font-size:12px;letter-spacing:.03em}
    .status-dot{width:5px;height:5px;border-radius:50%;background:#737b84;transition:all .3s}
    .action{position:relative;isolation:isolate;overflow:hidden;appearance:none;border:1px solid #ffffff24;border-radius:999px;min-width:238px;padding:17px 28px;background:linear-gradient(115deg,#fff,#e6e9ec);color:#080a0b;font:inherit;font-weight:760;font-size:14px;letter-spacing:-.01em;cursor:pointer;box-shadow:0 5px 0 #8b929b,0 12px 35px #0008,0 0 0 0 #dfff0000;transition:transform .3s var(--ease),box-shadow .3s,background .3s,color .3s}
    .action:before{content:"";position:absolute;z-index:-1;inset:0;transform:translateX(-120%) skewX(-20deg);background:linear-gradient(90deg,transparent,#dfff00b8,transparent);transition:transform .8s var(--ease)}
    .action:hover{transform:translateY(-3px);box-shadow:0 7px 0 #8b929b,0 18px 45px #0009,0 0 34px #dfff001a}
    .action:hover:before{transform:translateX(120%) skewX(-20deg)}
    .action:active{transform:translateY(2px);box-shadow:0 1px 0 #8b929b,0 5px 15px #0008}
    .action:focus-visible{outline:2px solid var(--acid);outline-offset:6px}
    .action:disabled{cursor:wait;opacity:.7;transform:none}
    body.connected .orb{background:radial-gradient(circle at 32% 23%,#f4ff9c 0,#dfff00 13%,#839e00 34%,#35420b 59%,#080b05 79%);box-shadow:inset -18px -22px 36px #020305c9,inset 9px 8px 24px #ffffff42,0 0 35px #dfff0077,0 0 105px #dfff0034}
    body.connected .orb:before{background:conic-gradient(from 0deg,transparent 0 26%,#ffffff00 32%,#f5ffc9c9 39%,#ffffff00 45% 68%,#ffffff6b 76%,transparent 82%)}
    body.connected .aura{background:#dfff001c}
    body.connected .orbit{border-color:#dfff0038}
    body.connected .status-dot{background:var(--acid);box-shadow:0 0 12px #dfff00;animation:blink 1.4s infinite}
    body.connected .action{background:linear-gradient(110deg,#dfff00,#f3ffad);box-shadow:0 5px 0 #8da000,0 12px 35px #dfff0016}
    body.connected .action:hover{box-shadow:0 7px 0 #8da000,0 18px 45px #dfff0028}
    body.speaking .orb{transform:scale(1.075);box-shadow:0 0 42px #dfff006c,0 0 120px #dfff0038,inset 0 0 35px #ffffff2b}
    body.speaking .ring{animation-duration:1.3s}
    body.speaking .soundbars i{animation-duration:.43s}
    body.listening .orb{transform:scale(1.025)}
    .error{color:#ff91a8;max-width:370px;font-size:12px;line-height:1.6;padding:10px 14px;border:1px solid #ff63851c;border-radius:12px;background:#c41f480d}
    .foot{color:#626a74;font-size:10px;letter-spacing:.04em;margin-top:0}
    audio{display:none}
    @keyframes orbit-spin{to{transform:rotate(360deg)}}
    @keyframes orb-sheen{to{transform:rotate(360deg)}}
    @keyframes ring-pulse{0%{transform:scale(.64);opacity:0}18%{opacity:.65}100%{transform:scale(1.13);opacity:0}}
    @keyframes float{0%,100%{translate:0 0}50%{translate:0 -7px}}
    @keyframes aura{0%,100%{transform:scale(.88);opacity:.65}50%{transform:scale(1.12);opacity:1}}
    @keyframes wave{0%,100%{transform:scaleY(.48);opacity:.65}50%{transform:scaleY(1.08);opacity:1}}
    @keyframes blink{0%,100%{opacity:.45}50%{opacity:1}}
    @keyframes grid-drift{to{background-position:54px 54px}}
    @media(max-width:420px){body{padding:18px}.orb-wrap{width:260px;height:260px}.orb{width:142px;height:142px}.orbit{inset:5px}.orbit.two{inset:20px}main{gap:19px}.sub{font-size:13px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}.grid{display:none}}
  </style>
</head>
<body>
  <div class="grid" aria-hidden="true"></div>
  <main>
    <div class="brandline"><span class="brandmark"></span> FERIXDI AI <span style="color:#414851">/</span> VOICE INTERFACE</div>
    <h1>Меньше шума.<br><span>Больше охватов.</span></h1>
    <p class="sub">Голосовой наставник про AI-Reels, рост аудитории и внимание людей. Без лекций и воды — говорим по делу.</p>
    <div class="orb-wrap" aria-hidden="true">
      <div class="ring"></div><div class="ring"></div><div class="ring"></div>
      <div class="orbit"></div><div class="orbit two"></div><div class="aura"></div>
      <div class="orb"><div class="core"></div></div>
      <div class="soundbars"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    </div>
    <div class="status" id="status" role="status" aria-live="polite"><span class="status-dot"></span><span id="statusText">Система готова к диалогу</span></div>
    <button class="action" id="talk">Запустить голосовой канал ↗</button>
    <div class="error" id="error" hidden></div>
    <div class="foot">МИКРОФОН АКТИВИРУЕТСЯ ТОЛЬКО ПОСЛЕ ТВОЕГО НАЖАТИЯ</div>
    <audio id="remoteAudio" autoplay playsinline></audio>
  </main>
  <script type="module">
    const button=document.querySelector("#talk"),statusText=document.querySelector("#statusText"),errorEl=document.querySelector("#error"),audioEl=document.querySelector("#remoteAudio");
    let pc=null,stream=null,channel=null,connecting=false,connected=false;
    const handledToolCalls=new Set();
    let accessCode=sessionStorage.getItem("ferixdi_mentor_access_code")||"";
    function status(text){statusText.textContent=text}
    function error(text){errorEl.textContent=text;errorEl.hidden=!text}
    function sendEvent(event){if(channel?.readyState==="open")channel.send(JSON.stringify(event))}
    async function stop(){
      sendEvent({type:"session.close"});
      if(channel){try{channel.close()}catch{}}
      if(pc){try{pc.close()}catch{}}
      if(stream)stream.getTracks().forEach(track=>track.stop());
      pc=null;channel=null;stream=null;audioEl.srcObject=null;
      document.body.classList.remove("connected","speaking","listening");
      connected=false;connecting=false;button.disabled=false;button.textContent="Запустить голосовой канал ↗";status("Сеанс завершён");
    }
    async function start(){
      if(connecting)return;
      connecting=true;button.disabled=true;error("");status("Устанавливаю защищённое соединение…");
      try{
        if(!window.isSecureContext&&location.hostname!=="localhost")throw new Error("Для микрофона нужен HTTPS.");
        if(!accessCode&&!sessionStorage.getItem("ferixdi_access_prompted")){
          const code=prompt("Введи код доступа, если он у тебя есть. Если код не выдавали — оставь пустым.");
          sessionStorage.setItem("ferixdi_access_prompted","1");accessCode=code||"";
          if(accessCode)sessionStorage.setItem("ferixdi_mentor_access_code",accessCode);
        }
        stream=await navigator.mediaDevices.getUserMedia({audio:true});
        pc=new RTCPeerConnection();pc.addTrack(stream.getAudioTracks()[0],stream);
        pc.ontrack=event=>{audioEl.srcObject=event.streams[0];audioEl.play().catch(()=>{})};
        pc.onconnectionstatechange=()=>{
          if(pc?.connectionState==="connected"){connected=true;connecting=false;button.disabled=false;document.body.classList.add("connected");button.textContent="Завершить разговор ×";status("На связи. Твой ход.");error("")}
          if(pc&&["failed","disconnected"].includes(pc.connectionState)){error("Связь прервалась. Попробуй подключиться ещё раз.");stop()}
        };
        channel=pc.createDataChannel("oai-events");
        channel.addEventListener("message",async event=>{
          let data;try{data=JSON.parse(event.data)}catch{return}
          if(data.type==="input_audio_buffer.speech_started"){status("Слушаю тебя…");document.body.classList.add("listening");document.body.classList.remove("speaking")}
          if(data.type==="input_audio_buffer.speech_stopped"){document.body.classList.remove("listening")}
          if(data.type==="conversation.item.input_audio_transcription.completed"){
            const transcript=String(data.transcript||"").trim();
            if(!transcript||!channel||channel.readyState!=="open")return;
            sendEvent({type:"response.create",response:{output_modalities:["audio"]}});
          }
          if(data.type==="response.output_item.done"&&data.item?.type==="function_call"&&data.item?.name==="search_course_knowledge"){
            const callId=data.item.call_id;
            if(!callId||handledToolCalls.has(callId)||!channel||channel.readyState!=="open")return;
            handledToolCalls.add(callId);
            let output={results:[],note:"Поиск по базе временно недоступен. Не выдумывай точный ответ; направь ученика к материалам обучения или Ferixdi @ferixdiii."};
            try{
              let args={};try{args=JSON.parse(data.item.arguments||"{}")}catch{}
              const response=await fetch("/api/knowledge-search",{method:"POST",headers:{"Content-Type":"application/json",...(accessCode?{"x-mentor-access-code":accessCode}:{})},body:JSON.stringify({query:String(args.query||"").slice(0,1200)})});
              if(response.ok){const found=await response.json();output={results:(found.results||[]).slice(0,4).map(item=>({source:item.source,text:String(item.text||"").slice(0,1800),score:item.score}))}}
            }catch{}
            sendEvent({type:"conversation.item.create",item:{type:"function_call_output",call_id:callId,output:JSON.stringify(output).slice(0,9000)}});
            sendEvent({type:"response.create",response:{output_modalities:["audio"]}});
          }
          if(data.type==="response.audio.started"||data.type==="output_audio_buffer.started"){status("Говорю…");document.body.classList.remove("listening");document.body.classList.add("speaking")}
          if(data.type==="response.audio.done"||data.type==="output_audio_buffer.stopped"){document.body.classList.remove("speaking");status("На связи. Твой ход.")}
          if(data.type==="error")error(data.error?.message||"Ошибка голосовой сессии.");
        });
        const offer=await pc.createOffer();await pc.setLocalDescription(offer);
        const sdpResponse=await fetch("/api/session",{method:"POST",body:offer.sdp,headers:{"Content-Type":"application/sdp",...(accessCode?{"x-mentor-access-code":accessCode}:{})}});
        if(!sdpResponse.ok){
          const details=await sdpResponse.text();let message="Не удалось подключить голосовой сервис.";
          try{const parsed=JSON.parse(details);if(parsed?.error)message=parsed.error}catch{}
          if(sdpResponse.status===401){sessionStorage.removeItem("ferixdi_mentor_access_code");sessionStorage.removeItem("ferixdi_access_prompted");accessCode=""}
          throw new Error(message);
        }
        await pc.setRemoteDescription({type:"answer",sdp:await sdpResponse.text()});status("Почти на связи…");
      }catch(e){
        await stop();
        error(e?.name==="NotAllowedError"?"Браузер не дал доступ к микрофону. Разреши микрофон в адресной строке и нажми ещё раз.":(e?.message||"Не удалось подключиться."));
      }finally{connecting=false;button.disabled=false}
    }
    button.addEventListener("click",async()=>{if(connected){await stop();return}if(!connecting)await start()});
    window.addEventListener("beforeunload",()=>{stream?.getTracks().forEach(track=>track.stop());pc?.close()});
  </script>
</body>
</html>
